# DeepDeck as a dumb status display for agent-monitor.
# Pins from the stock firmware (DeepSea-Developments/DeepDeck.Ahuyama.fw):
#   key LEDs: 16x WS2812/SK6812 on GPIO17
#   notification LEDs: 2x WS2812/SK6812 on GPIO23 — ambient Claude-orange breathing
#   OLED SSD1306 128x64: I2C SDA=GPIO21 SCL=GPIO22
esphome:
  name: deepdeck
  friendly_name: DeepDeck
  on_boot:
    then:
      - light.turn_on:
          id: key_leds
          brightness: 100%
          effect: session_status
      # notif_leds deliberately stay off (glow variants were tried and reverted);
      # the light + effect remain defined for easy re-enabling.

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
  actions:
    - action: set_state
      variables:
        colors: int[]
        lines: string[]
        names: string[]
        flash: int[]
      then:
        - lambda: |-
            id(led_colors).assign(colors.begin(), colors.end());
            id(oled_lines).assign(lines.begin(), lines.end());
            id(key_names).assign(names.begin(), names.end());
            id(flash_flags).assign(flash.begin(), flash.end());
        - light.turn_on:
            id: key_leds
            brightness: 100%
            effect: session_status

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: led_colors
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(48, 0)'
  - id: oled_lines
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>{}'
  - id: key_names
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>(16)'
  - id: flash_flags
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(16, 0)'
  - id: overlay_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: overlay_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: key_leds
    internal: true
    pin: GPIO17
    num_leds: 16
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: session_status
          update_interval: 33ms
          lambda: |-
            // Pulse machinery kept: the daemon currently sends all-zero flash
            // flags (animation disliked), but can re-enable it without a reflash.
            uint32_t phase = millis() % 1200;
            float mod = phase < 600 ? phase / 600.0f : (1200 - phase) / 600.0f;
            mod = 0.15f + 0.85f * mod;
            for (int i = 0; i < it.size(); i++) {
              int base = i * 3;
              if (base + 2 < (int) id(led_colors).size()) {
                float m = (i < (int) id(flash_flags).size() && id(flash_flags)[i]) ? mod : 1.0f;
                it[i] = Color((uint8_t) (id(led_colors)[base] * m),
                              (uint8_t) (id(led_colors)[base + 1] * m),
                              (uint8_t) (id(led_colors)[base + 2] * m));
              } else {
                it[i] = Color::BLACK;
              }
            }

  - platform: esp32_rmt_led_strip
    id: notif_leds
    internal: true
    pin: GPIO23
    num_leds: 2
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: claude_pulse
          update_interval: 1s
          lambda: |-
            // Static saturated orange glow — muted terracotta reads white on
            // LEDs, and the breathing animation was disliked. Kept name for
            // on_boot compatibility.
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color((uint8_t) (255 * 0.25f), (uint8_t) (80 * 0.25f), 0);
            }

matrix_keypad:
  id: keypad
  # Stock scan is ACTIVE-HIGH: drive GPIO16/15/14/13, read GPIO0/4/5/12 with
  # pulldowns (has_pulldowns) — same current direction as the stock firmware,
  # so the key diodes conduct.
  rows:
    - pin: GPIO16
    - pin: GPIO15
    - pin: GPIO14
    - pin: GPIO13
  columns:
    - pin: GPIO0
    - pin: GPIO4
    - pin: GPIO5
    - pin: GPIO12
  # Scan index -> key char ('A' = slot 0 ... 'P' = slot 15), pre-transposed for the
  # swapped rows/columns. If the bench test (Task 12) shows a wrong mapping, reorder
  # THIS string only — plain "ABCDEFGHIJKLMNOP" is the un-transposed alternative to try first.
  keys: "AEIMBFJNCGKODHLP"
  debounce_time: 20
  has_pulldowns: true
  on_key:
    then:
      - lambda: |-
          id(overlay_slot) = x - 'A';
          id(overlay_until) = millis() + 3000;
      - component.update: oled

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

font:
  - file: "gfonts://Roboto Mono"
    id: font8
    size: 8

image:
  - file: "deepdeck_logo.xbm"
    id: kraken_logo
    type: BINARY

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      if (id(overlay_slot) >= 0) {
        if ((int32_t) (millis() - id(overlay_until)) < 0) {
          int slot = id(overlay_slot);
          char header[16];
          snprintf(header, sizeof(header), "key %d", slot + 1);
          it.print(0, 0, id(font8), header);
          std::string name = (slot < (int) id(key_names).size()) ? id(key_names)[slot] : std::string();
          it.print(0, 16, id(font8), name.empty() ? "(free)" : name.c_str());
          return;
        }
        id(overlay_slot) = -1;  // expired: clear so a millis() wrap cannot resurrect it
      }
      if (id(oled_lines).empty()) {
        it.image(0, 16, id(kraken_logo));
        return;
      }
      for (size_t i = 0; i < id(oled_lines).size() && i < 8; i++) {
        it.print(0, (int) (i * 8) - 3, id(font8), id(oled_lines)[i].c_str());
      }
