# DeepDeck as a dumb status display for agent-monitor.
# Pins from the stock firmware (DeepSea-Developments/DeepDeck.Ahuyama.fw):
#   key LEDs: 16x WS2812/SK6812 on GPIO17
#   notification LEDs: 2x WS2812/SK6812 on GPIO23 — ambient Claude-orange breathing
#   OLED SSD1306 128x64: I2C SDA=GPIO21 SCL=GPIO22
esphome:
  name: deepdeck
  friendly_name: DeepDeck
  on_boot:
    then:
      - light.turn_on:
          id: key_leds
          brightness: 100%
          effect: session_status
      # The two notification LEDs act as a static usage warning (amber/red when
      # the 5h limit runs hot). The decorative glow stays reverted.
      - light.turn_on:
          id: notif_leds
          brightness: 100%
          effect: usage_warning

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
  actions:
    - action: set_state
      variables:
        colors: int[]
        lines: string[]
        names: string[]
        flash: int[]
        info: string[]
        usage: int[]
      then:
        - lambda: |-
            id(led_colors).assign(colors.begin(), colors.end());
            id(oled_lines).assign(lines.begin(), lines.end());
            id(key_names).assign(names.begin(), names.end());
            id(flash_flags).assign(flash.begin(), flash.end());
            id(key_info).assign(info.begin(), info.end());
            id(usage_pcts).assign(usage.begin(), usage.end());
        - light.turn_on:
            id: key_leds
            brightness: 100%
            effect: session_status

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: led_colors
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(48, 0)'
  - id: oled_lines
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>{}'
  - id: key_names
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>(16)'
  - id: flash_flags
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(16, 0)'
  - id: key_info
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>(16)'
  - id: notif_brightness
    type: float
    restore_value: yes
    initial_value: '0.3'
  - id: notif_color
    type: int
    restore_value: yes
    initial_value: '0'
  - id: notif_mode
    type: int
    restore_value: yes
    initial_value: '0'  # 0 = usage traffic light, 1 = manual color
  - id: setting_mode
    type: int
    restore_value: no
    initial_value: '-1'
  - id: setting_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: usage_pcts
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>{}'
  - id: overlay_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: overlay_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: led_brightness
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: info_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: info_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: move_src
    type: int
    restore_value: no
    initial_value: '-1'
  - id: move_started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: menu_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: menu_cursor
    type: int
    restore_value: no
    initial_value: '0'
  - id: menu_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: key_leds
    internal: true
    pin: GPIO17
    num_leds: 16
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: session_status
          update_interval: 33ms
          lambda: |-
            // Pulse machinery kept: the daemon currently sends all-zero flash
            // flags (animation disliked), but can re-enable it without a reflash.
            uint32_t phase = millis() % 1200;
            float mod = phase < 600 ? phase / 600.0f : (1200 - phase) / 600.0f;
            mod = 0.15f + 0.85f * mod;
            for (int i = 0; i < it.size(); i++) {
              int base = i * 3;
              if (base + 2 < (int) id(led_colors).size()) {
                float m = (i < (int) id(flash_flags).size() && id(flash_flags)[i]) ? mod : 1.0f;
                float f = m * id(led_brightness);
                if (id(move_src) >= 0 && i == id(move_src)) {
                  // slow blink on the picked-up key while awaiting the target
                  f *= (millis() % 1000) < 500 ? 1.0f : 0.15f;
                }
                // Round instead of truncate: at 1-3 % brightness truncation
                // kills weak channels first and shifts hues (amber -> red).
                it[i] = Color((uint8_t) (id(led_colors)[base] * f + 0.5f),
                              (uint8_t) (id(led_colors)[base + 1] * f + 0.5f),
                              (uint8_t) (id(led_colors)[base + 2] * f + 0.5f));
              } else {
                it[i] = Color::BLACK;
              }
            }

  - platform: esp32_rmt_led_strip
    id: notif_leds
    internal: true
    pin: GPIO23
    num_leds: 2
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: usage_warning
          update_interval: 500ms
          lambda: |-
            // Two modes (right-knob rotation toggles): usage traffic light —
            // green relaxed, amber >= 75 %, red >= 90 % of the 5h limit, dark
            // when unknown — or the manually chosen static color. Brightness 0
            // means OFF in both modes, warning included. No animation.
            static const uint8_t PAL[11][3] = {
              {0,0,0}, {255,255,255}, {255,180,80}, {255,0,0}, {255,120,0},
              {255,220,0}, {0,255,0}, {0,255,255}, {0,0,255}, {160,0,255}, {255,0,120}};
            float b = id(notif_brightness);
            uint8_t r = 0, g = 0, bl = 0;
            if (id(notif_mode) == 0) {
              int pct = id(usage_pcts).empty() ? -1 : id(usage_pcts)[0];
              if (pct >= 90)      { r = 255; }
              else if (pct >= 75) { r = 255; g = 160; }
              else if (pct >= 0)  { g = 255; }
              // -1 (unknown/stale): stays dark
            } else {
              int ci = ((id(notif_color) % 11) + 11) % 11;
              r = PAL[ci][0]; g = PAL[ci][1]; bl = PAL[ci][2];
            }
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color((uint8_t) (r * b + 0.5f), (uint8_t) (g * b + 0.5f), (uint8_t) (bl * b + 0.5f));
            }

# Custom key-matrix scan replicating the stock firmware exactly (matrix.c,
# COL2ROW): every line is INPUT_OUTPUT idling LOW; sense rows use the weakest
# drive strength; the scanned column is driven strongly HIGH and overpowers a
# pressed key's weak-low row. Needs no pull resistors and works with or
# without diodes — unlike ESPHome's matrix_keypad, whose has_pulldowns mode
# expects EXTERNAL pulldowns this PCB does not have.
interval:
  - interval: 25ms
    then:
      - lambda: |-
          static const gpio_num_t SCAN_COLS[4] = {GPIO_NUM_16, GPIO_NUM_15, GPIO_NUM_14, GPIO_NUM_13};
          static const gpio_num_t SCAN_ROWS[4] = {GPIO_NUM_0, GPIO_NUM_4, GPIO_NUM_5, GPIO_NUM_12};
          static bool init_done = false;
          static bool last[16] = {false};
          static uint32_t last_press_ms[16] = {0};
          static uint32_t press_start[16] = {0};
          static bool hold_fired[16] = {false};
          if (!init_done) {
            for (int c = 0; c < 4; c++) {
              gpio_reset_pin(SCAN_COLS[c]);
              gpio_set_direction(SCAN_COLS[c], GPIO_MODE_INPUT_OUTPUT);
              gpio_set_level(SCAN_COLS[c], 0);
            }
            for (int r = 0; r < 4; r++) {
              gpio_reset_pin(SCAN_ROWS[r]);
              gpio_set_direction(SCAN_ROWS[r], GPIO_MODE_INPUT_OUTPUT);
              gpio_set_drive_capability(SCAN_ROWS[r], GPIO_DRIVE_CAP_0);
              gpio_set_level(SCAN_ROWS[r], 0);
            }
            init_done = true;
          }
          uint32_t now = millis();
          if (id(move_src) >= 0 && (uint32_t) (now - id(move_started)) > 10000) {
            id(move_src) = -1;  // move mode timed out
            id(info_until) = 0;
            id(oled).update();
          }
          for (int c = 0; c < 4; c++) {
            gpio_set_level(SCAN_COLS[c], 1);
            delayMicroseconds(5);
            for (int r = 0; r < 4; r++) {
              int slot = r * 4 + c;  // stock keymap order: row-major
              bool hit = gpio_get_level(SCAN_ROWS[r]);
              if (hit && !last[slot]) {
                if (id(menu_slot) >= 0) { id(menu_slot) = -1; }
                press_start[slot] = now;
                hold_fired[slot] = false;
                if (id(move_src) >= 0) {
                  if (slot != id(move_src)) {
                    ESP_LOGI("keypad", "move %d -> %d", id(move_src), slot);
                    id(move_req).publish_state(
                        to_string(id(move_src)) + ":" + to_string(slot) + ":" + to_string(now));
                  }
                  id(move_src) = -1;  // selected or cancelled either way
                  id(info_until) = 0;
                  id(oled).update();
                } else {
                  ESP_LOGI("keypad", "key press -> slot %d", slot);
                  id(overlay_slot) = slot;
                  id(overlay_until) = now + 3000;
                  id(oled).update();
                  if (now - last_press_ms[slot] < 400) {
                    ESP_LOGI("keypad", "double press -> slot %d", slot);
                    id(focus_req).publish_state(to_string(slot) + ":" + to_string(now));
                  }
                  last_press_ms[slot] = now;
                }
              }
              if (hit && last[slot] && !hold_fired[slot] && id(move_src) < 0
                  && (uint32_t) (now - press_start[slot]) >= 600) {
                hold_fired[slot] = true;
                id(move_src) = slot;
                id(move_started) = now;
                id(overlay_slot) = -1;  // move info replaces the name overlay
                std::string name = slot < (int) id(key_names).size() ? id(key_names)[slot] : std::string();
                id(info_text) = "move " + (name.empty() ? "key " + to_string(slot + 1) : name);
                id(info_until) = now + 10000;
                ESP_LOGI("keypad", "hold -> move mode from slot %d", slot);
                id(oled).update();
              }
              last[slot] = hit;
            }
            gpio_set_level(SCAN_COLS[c], 0);
          }

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

text_sensor:
  - platform: template
    id: focus_req
    name: "Focus Request"
    update_interval: never
  - platform: template
    id: move_req
    name: "Move Request"
    update_interval: never
  - platform: template
    id: action_req
    name: "Action Request"
    update_interval: never

sensor:
  - platform: rotary_encoder
    id: knob_left
    pin_a:
      number: GPIO25
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO26
      mode:
        input: true
        pullup: true
    on_clockwise:
      - lambda: |-
          if (id(menu_slot) >= 0) {
            id(menu_cursor) = (id(menu_cursor) + 1) % 3;
            id(menu_until) = millis() + 8000;
            id(oled).update();
            return;
          }
          // Fine 1 % steps below 10 % — the interesting dimming happens there.
          id(led_brightness) = std::min(1.0f, id(led_brightness) + (id(led_brightness) < 0.10f ? 0.01f : 0.05f));
          char buf[24];
          snprintf(buf, sizeof(buf), "brightness %d%%", (int) roundf(id(led_brightness) * 100));
          id(info_text) = buf;
          id(info_until) = millis() + 1500;
          id(oled).update();
    on_anticlockwise:
      - lambda: |-
          if (id(menu_slot) >= 0) {
            id(menu_cursor) = (id(menu_cursor) + 2) % 3;  // one step back
            id(menu_until) = millis() + 8000;
            id(oled).update();
            return;
          }
          // 1 % floor = one PWM step on the SK6812, the dimmest visible level.
          id(led_brightness) = std::max(0.01f, id(led_brightness) - (id(led_brightness) <= 0.10f ? 0.01f : 0.05f));
          char buf[24];
          snprintf(buf, sizeof(buf), "brightness %d%%", (int) roundf(id(led_brightness) * 100));
          id(info_text) = buf;
          id(info_until) = millis() + 1500;
          id(oled).update();

  # Right knob (encoder 2: GPIO33/32, switch GPIO27 — stock keyboard_config.h;
  # A/B swapped vs. the stock defines because the bench showed clockwise
  # decrementing): rotation toggles the notification-LED mode (usage traffic
  # light vs. manual color); with settings open it adjusts the active entry.
  - platform: rotary_encoder
    id: knob_right
    pin_a:
      number: GPIO32
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO33
      mode:
        input: true
        pullup: true
    on_clockwise:
      - lambda: |-
          if (id(menu_slot) >= 0) return;  // the menu belongs to the left knob
          uint32_t now = millis();
          if (id(setting_mode) >= 0) {     // settings open: adjust the active entry
            if (id(setting_mode) == 0)
              id(notif_brightness) = std::min(1.0f, id(notif_brightness) + (id(notif_brightness) < 0.10f ? 0.01f : 0.05f));
            else
              id(notif_color) = (id(notif_color) + 1) % 11;
            id(setting_until) = now + 8000;
            id(oled).update();
            return;
          }
          id(notif_mode) = id(notif_mode) == 0 ? 1 : 0;
          id(info_text) = id(notif_mode) == 0 ? "notif: usage" : "notif: manual";
          id(info_until) = now + 1500;
          id(oled).update();
    on_anticlockwise:
      - lambda: |-
          if (id(menu_slot) >= 0) return;
          uint32_t now = millis();
          if (id(setting_mode) >= 0) {
            if (id(setting_mode) == 0)
              id(notif_brightness) = std::max(0.0f, id(notif_brightness) - (id(notif_brightness) <= 0.10f ? 0.01f : 0.05f));
            else
              id(notif_color) = (id(notif_color) + 10) % 11;  // one step back
            id(setting_until) = now + 8000;
            id(oled).update();
            return;
          }
          id(notif_mode) = id(notif_mode) == 0 ? 1 : 0;
          id(info_text) = id(notif_mode) == 0 ? "notif: usage" : "notif: manual";
          id(info_until) = now + 1500;
          id(oled).update();

binary_sensor:
  - platform: gpio
    id: knob_left_btn
    internal: true
    pin:
      number: GPIO34
      mode:
        input: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - lambda: |-
            uint32_t now = millis();
            if (id(menu_slot) >= 0) {
              ESP_LOGI("menu", "action slot=%d option=%d", id(menu_slot), id(menu_cursor));
              id(action_req).publish_state(to_string(id(menu_slot)) + ":" +
                                           to_string(id(menu_cursor)) + ":" + to_string(now));
              // Reopen the key's overlay instead of a blind "sent" toast — the
              // daemon pushes the real result (reloading/locked/failed) into
              // the overlay's info lines within a second.
              id(overlay_slot) = id(menu_slot);
              id(overlay_until) = now + 4000;
              id(menu_slot) = -1;
            } else if (id(overlay_slot) >= 0 && (int32_t) (now - id(overlay_until)) < 0) {
              id(menu_slot) = id(overlay_slot);
              id(menu_cursor) = 0;
              id(menu_until) = now + 8000;
              id(overlay_slot) = -1;
            }
            id(oled).update();
    # GPIO34 is input-only with no internal pulls; the PCB biases it and the
    # stock firmware reads it active-high. If the bench shows the button
    # reading inverted (pressed = low reported as high, etc.), add
    # `inverted: true` on the pin above as the fix.

  - platform: gpio
    id: knob_right_btn
    internal: true
    pin:
      number: GPIO27
      mode:
        input: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - lambda: |-
            // Cycles the notification-LED settings: brightness -> color ->
            // close. Values persist (restore_value) and preview live on the
            // LEDs. Compact lives in the left-knob menu.
            uint32_t now = millis();
            if (id(menu_slot) >= 0) return;
            id(setting_mode) = id(setting_mode) >= 1 ? -1 : id(setting_mode) + 1;
            if (id(setting_mode) >= 0) id(setting_until) = now + 8000;
            id(oled).update();

font:
  - file: "gfonts://Roboto Mono"
    id: font8
    size: 8

image:
  - file: "deepdeck_logo.xbm"
    id: kraken_logo
    type: BINARY

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      if (id(menu_slot) >= 0) {
        if ((int32_t) (millis() - id(menu_until)) < 0) {
          std::string header = id(menu_slot) < (int) id(key_names).size() && !id(key_names)[id(menu_slot)].empty()
              ? id(key_names)[id(menu_slot)]
              : "key " + to_string(id(menu_slot) + 1);
          it.print(0, 0, id(font8), header.c_str());
          it.print(0, 16, id(font8), id(menu_cursor) == 0 ? "> restart session" : "  restart session");
          it.print(0, 28, id(font8), id(menu_cursor) == 1 ? "> toggle remote" : "  toggle remote");
          it.print(0, 40, id(font8), id(menu_cursor) == 2 ? "> compact context" : "  compact context");
          return;
        }
        id(menu_slot) = -1;
      }
      if (id(setting_mode) >= 0) {
        if ((int32_t) (millis() - id(setting_until)) < 0) {
          static const char *NAMES[11] = {"off", "white", "warm", "red", "orange",
                                          "yellow", "green", "cyan", "blue", "purple", "pink"};
          it.print(0, 0, id(font8), "notif LED settings");
          char buf[32];
          snprintf(buf, sizeof(buf), "%c brightness %d%%",
                   id(setting_mode) == 0 ? '>' : ' ', (int) (id(notif_brightness) * 100));
          it.print(0, 20, id(font8), buf);
          snprintf(buf, sizeof(buf), "%c color %s",
                   id(setting_mode) == 1 ? '>' : ' ', NAMES[((id(notif_color) % 11) + 11) % 11]);
          it.print(0, 32, id(font8), buf);
          it.print(0, 50, id(font8), "turn: adjust  click: next");
          return;
        }
        id(setting_mode) = -1;  // timed out
      }
      if (id(overlay_slot) >= 0) {
        if ((int32_t) (millis() - id(overlay_until)) < 0) {
          int slot = id(overlay_slot);
          char header[16];
          snprintf(header, sizeof(header), "key %d", slot + 1);
          it.print(0, 0, id(font8), header);
          std::string name = (slot < (int) id(key_names).size()) ? id(key_names)[slot] : std::string();
          it.print(0, 16, id(font8), name.empty() ? "(free)" : name.c_str());
          // Extra per-session lines from the daemon (model + effort, context %),
          // '\n'-separated in key_info.
          std::string info = (slot < (int) id(key_info).size()) ? id(key_info)[slot] : std::string();
          int y = 30;
          size_t start = 0;
          while (start < info.size() && y <= 54) {
            size_t nl = info.find('\n', start);
            std::string line = info.substr(start, nl == std::string::npos ? std::string::npos : nl - start);
            if (!line.empty()) {
              it.print(0, y, id(font8), line.c_str());
              y += 12;
            }
            if (nl == std::string::npos) break;
            start = nl + 1;
          }
          return;
        }
        id(overlay_slot) = -1;  // expired: clear so a millis() wrap cannot resurrect it
      }
      if (id(info_until) != 0) {
        if ((int32_t) (millis() - id(info_until)) < 0) {
          it.print(0, 0, id(font8), id(info_text).c_str());
          return;
        }
        id(info_until) = 0;
      }
      // Idle view: account usage (what /usage shows) — text via oled_lines,
      // bar fill via usage_pcts (-1 = stale, no bar). The header sits in the
      // physically YELLOW top 16 rows of the two-tone panel; bars live in the
      // blue zone. Without usage data the kraken returns.
      if (!id(oled_lines).empty()) {
        it.print(0, 0, id(font8), "Claude usage");
        int y = 20;
        for (size_t i = 0; i < id(oled_lines).size() && y <= 44; i++) {
          it.print(0, y, id(font8), id(oled_lines)[i].c_str());
          int pct = (i < id(usage_pcts).size()) ? id(usage_pcts)[i] : -1;
          if (pct >= 0) {
            int w = (124 * (pct > 100 ? 100 : pct)) / 100;
            it.rectangle(0, y + 11, 126, 6);
            if (w > 0) it.filled_rectangle(1, y + 12, w > 124 ? 124 : w, 4);
          }
          y += 22;
        }
        return;
      }
      it.image(44, 16, id(kraken_logo));
