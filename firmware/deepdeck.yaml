# DeepDeck as a dumb status display for agent-monitor.
# Pins from the stock firmware (DeepSea-Developments/DeepDeck.Ahuyama.fw):
#   key LEDs: 16x WS2812/SK6812 on GPIO17
#   notification LEDs: 2x WS2812/SK6812 on GPIO23 — ambient Claude-orange breathing
#   OLED SSD1306 128x64: I2C SDA=GPIO21 SCL=GPIO22
esphome:
  name: deepdeck
  friendly_name: DeepDeck
  on_boot:
    then:
      - light.turn_on:
          id: key_leds
          brightness: 100%
          effect: session_status
      # notif_leds deliberately stay off (glow variants were tried and reverted);
      # the light + effect remain defined for easy re-enabling.

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
  actions:
    - action: set_state
      variables:
        colors: int[]
        lines: string[]
        names: string[]
        flash: int[]
      then:
        - lambda: |-
            id(led_colors).assign(colors.begin(), colors.end());
            id(oled_lines).assign(lines.begin(), lines.end());
            id(key_names).assign(names.begin(), names.end());
            id(flash_flags).assign(flash.begin(), flash.end());
        - light.turn_on:
            id: key_leds
            brightness: 100%
            effect: session_status

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: led_colors
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(48, 0)'
  - id: oled_lines
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>{}'
  - id: key_names
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>(16)'
  - id: flash_flags
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(16, 0)'
  - id: overlay_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: overlay_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: led_brightness
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: info_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: info_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: move_src
    type: int
    restore_value: no
    initial_value: '-1'
  - id: move_started
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: key_leds
    internal: true
    pin: GPIO17
    num_leds: 16
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: session_status
          update_interval: 33ms
          lambda: |-
            // Pulse machinery kept: the daemon currently sends all-zero flash
            // flags (animation disliked), but can re-enable it without a reflash.
            uint32_t phase = millis() % 1200;
            float mod = phase < 600 ? phase / 600.0f : (1200 - phase) / 600.0f;
            mod = 0.15f + 0.85f * mod;
            for (int i = 0; i < it.size(); i++) {
              int base = i * 3;
              if (base + 2 < (int) id(led_colors).size()) {
                float m = (i < (int) id(flash_flags).size() && id(flash_flags)[i]) ? mod : 1.0f;
                float f = m * id(led_brightness);
                if (id(move_src) >= 0 && i == id(move_src)) {
                  // slow blink on the picked-up key while awaiting the target
                  f *= (millis() % 1000) < 500 ? 1.0f : 0.15f;
                }
                it[i] = Color((uint8_t) (id(led_colors)[base] * f),
                              (uint8_t) (id(led_colors)[base + 1] * f),
                              (uint8_t) (id(led_colors)[base + 2] * f));
              } else {
                it[i] = Color::BLACK;
              }
            }

  - platform: esp32_rmt_led_strip
    id: notif_leds
    internal: true
    pin: GPIO23
    num_leds: 2
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: claude_pulse
          update_interval: 1s
          lambda: |-
            // Static saturated orange glow — muted terracotta reads white on
            // LEDs, and the breathing animation was disliked. Kept name for
            // on_boot compatibility.
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color((uint8_t) (255 * 0.25f), (uint8_t) (80 * 0.25f), 0);
            }

# Custom key-matrix scan replicating the stock firmware exactly (matrix.c,
# COL2ROW): every line is INPUT_OUTPUT idling LOW; sense rows use the weakest
# drive strength; the scanned column is driven strongly HIGH and overpowers a
# pressed key's weak-low row. Needs no pull resistors and works with or
# without diodes — unlike ESPHome's matrix_keypad, whose has_pulldowns mode
# expects EXTERNAL pulldowns this PCB does not have.
interval:
  - interval: 25ms
    then:
      - lambda: |-
          static const gpio_num_t SCAN_COLS[4] = {GPIO_NUM_16, GPIO_NUM_15, GPIO_NUM_14, GPIO_NUM_13};
          static const gpio_num_t SCAN_ROWS[4] = {GPIO_NUM_0, GPIO_NUM_4, GPIO_NUM_5, GPIO_NUM_12};
          static bool init_done = false;
          static bool last[16] = {false};
          static uint32_t last_press_ms[16] = {0};
          static uint32_t press_start[16] = {0};
          static bool hold_fired[16] = {false};
          if (!init_done) {
            for (int c = 0; c < 4; c++) {
              gpio_reset_pin(SCAN_COLS[c]);
              gpio_set_direction(SCAN_COLS[c], GPIO_MODE_INPUT_OUTPUT);
              gpio_set_level(SCAN_COLS[c], 0);
            }
            for (int r = 0; r < 4; r++) {
              gpio_reset_pin(SCAN_ROWS[r]);
              gpio_set_direction(SCAN_ROWS[r], GPIO_MODE_INPUT_OUTPUT);
              gpio_set_drive_capability(SCAN_ROWS[r], GPIO_DRIVE_CAP_0);
              gpio_set_level(SCAN_ROWS[r], 0);
            }
            init_done = true;
          }
          uint32_t now = millis();
          if (id(move_src) >= 0 && (uint32_t) (now - id(move_started)) > 10000) {
            id(move_src) = -1;  // move mode timed out
            id(info_until) = 0;
            id(oled).update();
          }
          for (int c = 0; c < 4; c++) {
            gpio_set_level(SCAN_COLS[c], 1);
            delayMicroseconds(5);
            for (int r = 0; r < 4; r++) {
              int slot = r * 4 + c;  // stock keymap order: row-major
              bool hit = gpio_get_level(SCAN_ROWS[r]);
              if (hit && !last[slot]) {
                press_start[slot] = now;
                hold_fired[slot] = false;
                if (id(move_src) >= 0) {
                  if (slot != id(move_src)) {
                    ESP_LOGI("keypad", "move %d -> %d", id(move_src), slot);
                    id(move_req).publish_state(
                        to_string(id(move_src)) + ":" + to_string(slot) + ":" + to_string(now));
                  }
                  id(move_src) = -1;  // selected or cancelled either way
                  id(info_until) = 0;
                  id(oled).update();
                } else {
                  ESP_LOGI("keypad", "key press -> slot %d", slot);
                  id(overlay_slot) = slot;
                  id(overlay_until) = now + 3000;
                  id(oled).update();
                  if (now - last_press_ms[slot] < 400) {
                    ESP_LOGI("keypad", "double press -> slot %d", slot);
                    id(focus_req).publish_state(to_string(slot) + ":" + to_string(now));
                  }
                  last_press_ms[slot] = now;
                }
              }
              if (hit && last[slot] && !hold_fired[slot] && id(move_src) < 0
                  && (uint32_t) (now - press_start[slot]) >= 600) {
                hold_fired[slot] = true;
                id(move_src) = slot;
                id(move_started) = now;
                id(overlay_slot) = -1;  // move info replaces the name overlay
                std::string name = slot < (int) id(key_names).size() ? id(key_names)[slot] : std::string();
                id(info_text) = "move " + (name.empty() ? "key " + to_string(slot + 1) : name);
                id(info_until) = now + 10000;
                ESP_LOGI("keypad", "hold -> move mode from slot %d", slot);
                id(oled).update();
              }
              last[slot] = hit;
            }
            gpio_set_level(SCAN_COLS[c], 0);
          }

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

text_sensor:
  - platform: template
    id: focus_req
    name: "Focus Request"
    update_interval: never
  - platform: template
    id: move_req
    name: "Move Request"
    update_interval: never

sensor:
  - platform: rotary_encoder
    id: knob_left
    pin_a:
      number: GPIO25
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO26
      mode:
        input: true
        pullup: true
    on_clockwise:
      - lambda: |-
          id(led_brightness) = std::min(1.0f, id(led_brightness) + 0.05f);
          char buf[24];
          snprintf(buf, sizeof(buf), "brightness %d%%", (int) (id(led_brightness) * 100));
          id(info_text) = buf;
          id(info_until) = millis() + 1500;
          id(oled).update();
    on_anticlockwise:
      - lambda: |-
          id(led_brightness) = std::max(0.05f, id(led_brightness) - 0.05f);
          char buf[24];
          snprintf(buf, sizeof(buf), "brightness %d%%", (int) (id(led_brightness) * 100));
          id(info_text) = buf;
          id(info_until) = millis() + 1500;
          id(oled).update();

font:
  - file: "gfonts://Roboto Mono"
    id: font8
    size: 8

image:
  - file: "deepdeck_logo.xbm"
    id: kraken_logo
    type: BINARY

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      if (id(overlay_slot) >= 0) {
        if ((int32_t) (millis() - id(overlay_until)) < 0) {
          int slot = id(overlay_slot);
          char header[16];
          snprintf(header, sizeof(header), "key %d", slot + 1);
          it.print(0, 0, id(font8), header);
          std::string name = (slot < (int) id(key_names).size()) ? id(key_names)[slot] : std::string();
          it.print(0, 16, id(font8), name.empty() ? "(free)" : name.c_str());
          return;
        }
        id(overlay_slot) = -1;  // expired: clear so a millis() wrap cannot resurrect it
      }
      if (id(info_until) != 0) {
        if ((int32_t) (millis() - id(info_until)) < 0) {
          it.print(0, 0, id(font8), id(info_text).c_str());
          return;
        }
        id(info_until) = 0;
      }
      // Idle view is the kraken (Aaron's preference) — the LEDs carry the
      // status; session names appear on key press. oled_lines stays in the
      // protocol should a list view ever return.
      it.image(37, 0, id(kraken_logo));
