# DeepDeck as a dumb status display for agent-monitor.
# Pins from the stock firmware (DeepSea-Developments/DeepDeck.Ahuyama.fw):
#   key LEDs: 16x WS2812/SK6812 on GPIO17 (notification LEDs GPIO23 unused)
#   OLED SSD1306 128x64: I2C SDA=GPIO21 SCL=GPIO22
esphome:
  name: deepdeck
  friendly_name: DeepDeck
  on_boot:
    then:
      - light.turn_on:
          id: key_leds
          brightness: 100%
          effect: session_status

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
  actions:
    - action: set_state
      variables:
        colors: int[]
        lines: string[]
        names: string[]
      then:
        - lambda: |-
            id(led_colors).assign(colors.begin(), colors.end());
            id(oled_lines).assign(lines.begin(), lines.end());
            id(key_names).assign(names.begin(), names.end());
        - light.turn_on:
            id: key_leds
            brightness: 100%
            effect: session_status

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: led_colors
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(48, 0)'
  - id: oled_lines
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>{}'
  - id: key_names
    type: std::vector<std::string>
    restore_value: no
    initial_value: 'std::vector<std::string>(16)'
  - id: overlay_slot
    type: int
    restore_value: no
    initial_value: '-1'
  - id: overlay_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: esp32_rmt_led_strip
    id: key_leds
    internal: true
    pin: GPIO17
    num_leds: 16
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 0
    effects:
      - addressable_lambda:
          name: session_status
          update_interval: 100ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              int base = i * 3;
              if (base + 2 < (int) id(led_colors).size()) {
                it[i] = Color(id(led_colors)[base],
                              id(led_colors)[base + 1],
                              id(led_colors)[base + 2]);
              } else {
                it[i] = Color::BLACK;
              }
            }

matrix_keypad:
  id: keypad
  rows:
    - pin: GPIO0
    - pin: GPIO4
    - pin: GPIO5
    - pin: GPIO12
  columns:
    - pin: GPIO16
    - pin: GPIO15
    - pin: GPIO14
    - pin: GPIO13

binary_sensor:
  - platform: matrix_keypad
    keypad_id: keypad
    id: key_1
    internal: true
    row: 0
    col: 0
    on_press:
